# SDK platform names and the watches that run them. Used by the platform
# notice shown on guides that set `platforms:` in their front matter.

aplite:
  name: Aplite
  watches: [Pebble, Pebble Steel]
basalt:
  name: Basalt
  watches: [Pebble Time, Pebble Time Steel]
chalk:
  name: Chalk
  watches: [Pebble Time Round]
diorite:
  name: Diorite
  watches: [Pebble 2]
emery:
  name: Emery
  watches: [Pebble Time 2]
flint:
  name: Flint
  watches: [Pebble 2 Duo]
gabbro:
  name: Gabbro
  watches: [Pebble Round 2]
