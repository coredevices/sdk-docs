name: Build static site

# Pushes to main build and deploy the site. Pull requests build it the same
# way (C, PebbleKit Android and iOS references included) and check every
# internal link in the result; they never deploy and never touch the
# production search index.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  gendocs-c:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/coredevices/pebbleos-docker:v8

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout sdk-docs
        uses: actions/checkout@v6

      - name: Read emery SDK version
        id: version
        run: echo "version=$(cat EMERY_SDK_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout pebble-firmware
        uses: actions/checkout@v6
        with:
          repository: coredevices/pebbleos
          ref: ${{ steps.version.outputs.version }}
          submodules: true

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      # Tags up to v4.36.x build with waf; v4.37.0 and later build with
      # CMake through the pbl tool, and nothing there runs doxygen anymore.
      - name: Build emery SDK and generate SDK documentation
        run: |
          if [ -f wscript ]; then
            ./waf configure --board qemu_emery -DCONFIG_MODDABLE_XS=n
            ./waf build --onlysdk
            ./waf docs_sdk
          else
            pbl -b build configure --board qemu_emery -DCONFIG_MODDABLE_XS=n
            pbl -b build build sdk
            doxygen build/sdk/emery/Doxyfile-SDK.auto
          fi

      - name: Publish docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-c-emery
          path: build/sdk/emery/doxygen_sdk

  # TODO: maybe build in pebble-dev/pebble-android-sdk, and publish releases?
  gendocs-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pebble-android-sdk
        uses: actions/checkout@v6
        with:
          repository: pebble-dev/pebble-android-sdk

      - name: Generate documentation
        working-directory: PebbleKit
        run: |
          ./gradlew releaseJavadoc

      - name: Publish docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-android
          path: PebbleKit/PebbleKit/build/docs/javadoc

  # TODO: maybe fork into pebble-dev, build there, and publish releases?
  gendocs-ios:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pebble-ios-sdk
        uses: actions/checkout@v6
        with:
          repository: pebble/pebble-ios-sdk

      - name: Publish docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-ios
          path: PebbleKit-iOS.docset/Contents/Resources/Documents

  # Firmware documentation: pebbleos docs/ (Sphinx) and its Doxygen reference,
  # rendered into the site by scripts/import_pebbleos_docs.py. It tracks
  # pebbleos main, like readthedocs "latest"; the SDK reference above is
  # pinned to EMERY_SDK_VERSION separately.
  gendocs-pebbleos:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sdk-docs
        uses: actions/checkout@v6

      - name: Checkout pebbleos
        uses: actions/checkout@v6
        with:
          repository: coredevices/pebbleos
          ref: main
          path: pebbleos

      - name: Record PebbleOS revision
        run: echo "Generated from PebbleOS $(git -C pebbleos rev-parse HEAD)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Doxygen and Sphinx
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          pip install -r pebbleos/docs/requirements.txt

      - name: Import PebbleOS documentation
        run: python3 scripts/import_pebbleos_docs.py pebbleos /tmp/pebbleos-site

      - name: Publish docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-pebbleos
          path: /tmp/pebbleos-site

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs:
      - gendocs-c
      - gendocs-android
      - gendocs-ios
      - gendocs-pebbleos

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the Markdown export dates each page from git.
          fetch-depth: 0

      - name: Download docs artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: docs-*
          path: /tmp/docs

      - name: Prepare emery doxygen docs
        run: |
          mkdir -p emery/doxygen_sdk
          cp -r /tmp/docs/docs-c-emery/* emery/doxygen_sdk/

      - name: Prepare PebbleOS docs
        run: cp -R /tmp/docs/docs-pebbleos/source/. source/

      - name: Prepare PebbleKit archives
        working-directory: /tmp/docs
        run: |
          mv docs-android javadoc
          zip -r pebblekit_android_4.0.1.zip javadoc

          cd docs-ios
          zip -r ../pebblekit_ios_4.0.0.zip *

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          URL: https://developer.repebble.com
          HTTPS_URL: https://developer.repebble.com
          JEKYLL_ENV: production
          DOCS_URL: /tmp/docs/
          ALGOLIA_APP_ID: ${{ github.event_name != 'pull_request' && secrets.ALGOLIA_APP_ID || '' }}
          ALGOLIA_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ALGOLIA_API_KEY || '' }}
          ALGOLIA_SEARCH_KEY: ${{ github.event_name != 'pull_request' && secrets.ALGOLIA_SEARCH_KEY || '' }}
          ALGOLIA_PREFIX: developer-repebble-com-prod-

      # Offline: internal links and anchors only. Known legacy patterns are
      # listed in .lycheeignore.
      - name: Check internal links
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/__public__
            --index-files index.html
            --include-fragments
            --preprocess ${{ github.workspace }}/scripts/lychee-preprocess.sh
            --exclude-path __public__/pebbleos/apidoc
            --exclude-path __public__/docs/pebblekit-android
            --exclude-path __public__/docs/pebblekit-ios
            --no-progress
            '__public__/**/*.html'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: site-build
          path: __public__

      # Pull requests also build main from the same docs artifacts and
      # publish a side-by-side comparison (scripts/compare_builds.py) as an
      # artifact, so reviewers can look at every changed page.
      - name: Checkout main for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline
          fetch-depth: 0
      - name: Build main for comparison
        if: github.event_name == 'pull_request'
        working-directory: baseline
        run: |
          mkdir -p emery/doxygen_sdk
          cp -r /tmp/docs/docs-c-emery/* emery/doxygen_sdk/
          cp -R /tmp/docs/docs-pebbleos/source/. source/
          BUNDLE_GEMFILE="$GITHUB_WORKSPACE/Gemfile" bundle exec jekyll build
        env:
          URL: https://developer.repebble.com
          HTTPS_URL: https://developer.repebble.com
          JEKYLL_ENV: production
          DOCS_URL: /tmp/docs/
          ALGOLIA_PREFIX: developer-repebble-com-prod-
      - name: Build the comparison site
        if: github.event_name == 'pull_request'
        run: python3 scripts/compare_builds.py --old baseline/__public__ --new __public__ --static site-compare
      - name: Upload the comparison site
        if: github.event_name == 'pull_request'
        id: compare
        uses: actions/upload-artifact@v4
        with:
          name: site-compare
          path: site-compare
          retention-days: 30
      - name: Deploy the comparison to Cloudflare Pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-compare --project-name=sdk-docs-compare --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true
      - name: Link the comparison from the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.compare.outputs.artifact-url }}
        run: |
          body="<!-- site-compare -->
          **Side-by-side comparison of this build against \`main\`:** https://pr-$PR.sdk-docs-compare.pages.dev/

          The left side is the current site, the right side is this pull request; added blocks are highlighted on the right and removed ones on the left. Use the arrows or the \`n\`, \`p\` and \`j\` keys to step through changed pages.

          The same comparison is attached as the [\`site-compare\` artifact]($URL); unzip it and run \`python3 -m http.server\` inside it to view it locally. Built from $GITHUB_SHA."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- site-compare -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  deploy:
    runs-on: ubuntu-24.04
    if: github.ref_name == 'main'
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-build
