- name: Firmware and SDK
  slug: firmware-and-sdk
  projects:
    - name: PebbleOS
      github: coredevices/pebbleos
      summary: The watch firmware. The Pebble SDK is built from this source tree.
      license: Apache License 2.0
    - name: pebble-tool
      github: coredevices/pebble-tool
      summary: The `pebble` command line tool, which builds, installs and debugs apps and manages SDKs.
      license: MIT
    - name: SDK documentation
      github: coredevices/sdk-docs
      summary: The source of this developer site.
      license: Apache License 2.0
    - name: Pebble examples
      github: pebble-examples
      summary: Example apps and watchfaces in C and PebbleKit JS, one repository per example.
      license: Varies per repository
    - name: Alloy examples
      github: Moddable-OpenSource/pebble-examples
      summary: Example apps and watchfaces written in JavaScript with Alloy.
      license: See repository
    - name: Pebble watchface agent skill
      github: coredevices/pebble-watchface-agent-skill
      summary: A skill for AI coding agents that builds and tests Pebble watchfaces with the SDK and the emulator.
      license: See repository
- name: Mobile App and Tools
  slug: mobile-app-and-tools
  projects:
    - name: Pebble mobile app
      github: coredevices/mobileapp
      summary: The Pebble mobile app for Android and iOS, including libpebble3, the Kotlin multiplatform library for talking to Pebble watches.
      license: GPL-3.0
    - name: CloudPebble
      github: coredevices/cloudpebble
      summary: The web IDE for building Pebble apps in the browser.
      license: MIT
    - name: QEMU
      github: coredevices/qemu
      summary: Fork of QEMU with Pebble machine types, used by the SDK emulator.
      license: GPLv2
    - name: pypkjs
      github: coredevices/pypkjs
      summary: Python implementation of PebbleKit JS, used by the SDK emulator.
      license: MIT
- name: Community SDKs
  slug: community-sdks
  projects:
    - name: zig-pebble-sdk
      github: vsergeev/zig-pebble-sdk
      summary: Build Pebble watchapps and watchfaces in Zig, with access to the Pebble C API.
      license: MIT
    - name: rust4pebble
      github: jbellerb/rust4pebble
      summary: Rust bindings for the Pebble SDK.
      license: LGPL-3.0
